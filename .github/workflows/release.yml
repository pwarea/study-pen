name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-msvc
      - name: Validate release reference
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REFERENCE_TYPE: ${{ github.ref_type }}
        run: |
          $version = ((Get-Content Cargo.toml | Select-String '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$').Matches.Groups[1].Value)
          if (-not $version) { throw 'Cargo.toml must contain a stable release version.' }
          if ($env:REFERENCE_TYPE -eq 'tag' -and $env:RELEASE_TAG -ne "v$version") {
            throw 'The version tag must exactly match Cargo.toml.'
          }
      - name: Check formatting and Clippy
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
      - name: Test and package
        env:
          PUBLIC_GITHUB_REPOSITORY: ${{ github.server_url == 'https://github.com' && toJSON(github.event.repository.private) == 'false' }}
        run: |
          if ($env:PUBLIC_GITHUB_REPOSITORY -eq 'true') {
            ./scripts/build.ps1 -GitHubRepository $env:GITHUB_REPOSITORY
          } else {
            ./scripts/build.ps1
          }
      - name: Save workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-pen-release-files
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
